<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.seo_title }}</title>
<meta name="description" content="{{ page.desc }}">
<link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url | uri_escape }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:locale" content="zh_TW">
<meta property="og:title" content="{{ page.seo_title }}">
<meta property="og:description" content="{{ page.desc }}">
<meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url | uri_escape }}">
<meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
</head>
<body class="{{ page.body_class }}">

<div class="topbar">
  <div class="wrap">
    <nav class="topnav">
      <a href="{{ site.baseurl }}/field-box/">Field-Box</a>
      <a href="{{ site.baseurl }}/qgis/">QGIS 課程</a>
    </nav>
  </div>
</div>

{{ content }}

{% assign f = site.data.footer[page.body_class] %}
<footer>
  <div class="wrap">
    <strong>{{ f.title }}</strong>
    <p class="about-text">{{ f.text }}</p>
    <p class="about-contact">
      使用上遇到Bug或其他問題可直接寄信給我：<a href="mailto:a.wen90@gmail.com">a.wen90@gmail.com</a>
    </p>
  </div>
</footer>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ site.description }}">
<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
</head>
<body class="{{ page.body_class }}">

<div class="topbar">
  <div class="wrap">
    <nav class="topnav">
      <a href="{{ site.baseurl }}/">Field-Box</a>
      <a href="{{ site.baseurl }}/qgis/">QGIS 課程</a>
    </nav>
  </div>
</div>

{{ content }}

{% assign f = site.data.footer[page.body_class] %}
<footer>
  <div class="wrap">
    <strong>{{ f.title }}</strong>
    <p class="about-text">{{ f.text }}</p>
    <p class="about-contact">
      使用上遇到Bug或其他問題可直接寄信給我：<a href="mailto:a.wen90@gmail.com">a.wen90@gmail.com</a>
    </p>
  </div>
</footer>

</body>
</html>

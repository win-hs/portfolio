---
layout: default
body_class: page-home
---

<div class="hero">
  <div class="wrap">
    <h1>Field-Box 田野調查小工具</h1>
  </div>
</div>

<section id="tools">
  <div class="wrap">
    <div class="tools">
      {% for tool in site.data.tools %}
      <a class="tool" href="{{ tool.url }}">
        <img class="logo" src="{{ site.baseurl }}/assets/img/logos/{{ tool.logo }}" alt="" width="56" height="56">
        <h2>{{ tool.name }}：{{ tool.zh }}</h2>
        <p>{{ tool.desc }}</p>
        <span class="go">開啟</span>
      </a>
      {% endfor %}
    </div>
  </div>
</section>
